[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "SagittalBrain"
version = "0.1.0"
dependencies = [
    "numpy>=1.20.0",
]

[project.scripts]
sagittal_average_run = "sagittal_brain.command:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sagittal_brain"]